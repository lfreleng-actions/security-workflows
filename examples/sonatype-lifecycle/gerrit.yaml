---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# =============================================================================
# EXAMPLE: Gerrit-wrapped caller for the Sonatype Lifecycle (CLM) lane
# =============================================================================
# Use this form when Gerrit is the source of truth (SCM) for your project.
# gerrit_to_platform dispatches this workflow (via the GitHub API) when a
# patchset is created in Gerrit; it then votes Verified +/-1 on the change.
#
# DEPLOYMENT NOTES:
#   * Copy into .github/workflows/ with a filename containing BOTH 'gerrit'
#     AND the lane name so gerrit_to_platform can discover it, e.g.
#     gerrit-clm.yaml.
#   * The workflow file must exist on EVERY active branch: dispatches
#     target refs/heads/{GERRIT_BRANCH}.
#   * The nine GERRIT_* inputs are populated automatically by the dispatcher.
#   * GERRIT_DISABLED lets you run manually from the GitHub UI without Gerrit
#     (the clear/vote jobs are skipped and a normal checkout is used).
#   * Set the repository variables GERRIT_SERVER, GERRIT_SSH_USER,
#     GERRIT_KNOWN_HOSTS, GERRIT_URL, NEXUS_IQ_SERVER, NEXUS_IQ_USERNAME,
#     and the secrets GERRIT_SSH_PRIVKEY and NEXUS_IQ_PASSWORD.
#   * The settings.xml synthesis shown below additionally needs the
#     variable NEXUS_USERNAME and the secret NEXUS_PASSWORD. Both are
#     needed only for an authenticated pre-scan build; drop the maven_*
#     inputs and maven_server_password with them if the build needs no
#     credentials.
#   * Gerrit voting connects over SSH (tcp/29418). Ensure the harden-runner
#     allow-list in use carries that entry, or the vote job fails in block
#     mode.
#   * The lane call below builds a Maven project. For a Go project, see the
#     GO PROJECTS block beside the maven_* inputs.
#
# AUTHENTICATED BUILDS:
#   Where the pre-scan build needs credentialed repository access, there
#   are two options. Either store a complete settings.xml as a
#   repository secret and pass it as maven_global_settings, or describe
#   the server shape with the maven_* inputs and let the lane synthesise
#   the document with maven-xml-settings-action, as shown below.
#
#   Prefer synthesis where credentials differ per repository: the
#   username is an input, so a caller can derive it, and only the
#   password is a secret. Do NOT synthesise settings.xml in a preceding
#   job and forward it here, because GitHub redacts job outputs
#   containing registered secrets and the password would arrive as
#   '***'.
# =============================================================================
name: 'Gerrit CLM'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''
      GERRIT_DISABLED:
        description: 'Run without Gerrit components'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Clear any previous Verified vote so the change starts from a clean state.
  clear-vote:
    if: inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: 'Clear votes'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
      - name: 'Allow replication'
        run: sleep 10s

  # Call the CLM lane. When dispatched by Gerrit, the gerrit_* inputs drive
  # checkout-gerrit-change-action inside the lane. For a manual
  # GERRIT_DISABLED run the GERRIT_* inputs are empty, so the lane performs
  # a normal checkout.
  sonatype-lifecycle:
    needs: clear-vote
    if: >-
      always()
      && (needs.clear-vote.result == 'success'
          || needs.clear-vote.result == 'skipped')
    permissions:
      contents: read
    # REPLACE the pinned SHA below with a security-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/sonatype-lifecycle.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    with:
      # When GERRIT_DISABLED is true the gerrit_* values are blanked so the
      # lane falls back to a standard checkout.
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_REFSPEC || '' }}
      # yamllint disable-line rule:line-length
      gerrit_project: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_PROJECT || '' }}
      # yamllint disable-line rule:line-length
      gerrit_branch: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_BRANCH || '' }}
      # gerrit_url falls back to the GERRIT_URL repository variable.
      #
      # Build the project so the scan sees resolved dependencies. Leave
      # java_version empty to auto-detect the project's JDK; the Nexus IQ
      # CLI runs on iq_java_version (17) regardless, which is what stops
      # an older build JDK breaking the scanner.
      build_type: 'maven'
      mvn_params: '-DskipTests --fail-at-end'
      # Dependency fetches from artifact CDNs are impractical to enumerate
      # in the egress allow-list; audit the job rather than blocking it.
      build_permit_egress_traffic: true
      #
      # Describe the Maven servers so the lane synthesises settings.xml.
      # The values below are the ONAP shape: five server ids sharing one
      # credential, the onap-public mirror, and the onap-nexus profile.
      # yamllint disable-line rule:line-length
      maven_server_ids: 'ecomp-releases,ecomp-snapshots,onap-releases,onap-snapshots,nexus3.onap.org:10003'
      maven_server_username: ${{ vars.NEXUS_USERNAME }}
      maven_mirror_id: 'onap-public'
      maven_mirror_url: 'https://nexus.onap.org/content/groups/public/'
      maven_profile_id: 'onap-nexus'
      # yamllint disable-line rule:line-length
      maven_profile_repository_url: 'https://nexus.onap.org/content/groups/public/'
      #
      # GO PROJECTS: drop mvn_params and every maven_* input above (plus
      # maven_server_password below, which only the settings.xml
      # synthesis needs), then set:
      #
      #   build_type: 'go'
      #   scan_mode: 'sbom'
      #
      # scan_mode selects how results reach Nexus IQ, and the two modes
      # do not evaluate the same thing:
      #   'cli'  - the Nexus IQ CLI scans go.sum; the lane default
      #   'sbom' - a cyclonedx-gomod SBOM is POSTed to the Nexus IQ REST
      #            API, matching the legacy Jenkins
      #            gerrit-nexus-iq-go-clm job's nexus-iq-use-cli: false
      #            branch
      #
      # Pin scan_mode EXPLICITLY when migrating off that Jenkins job.
      # Because the lane defaults to 'cli', a caller that omits the
      # input gets results the Jenkins job never produced, with no error
      # to say so, and the cutover comparison is quietly invalidated.
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}
      maven_server_password: ${{ secrets.NEXUS_PASSWORD }}
      # Alternatively, supply a complete settings.xml instead of the
      # maven_* inputs above:
      # maven_global_settings: ${{ secrets.MAVEN_GLOBAL_SETTINGS }}

  # Report the overall workflow conclusion back to Gerrit as a Verified vote.
  vote:
    if: ${{ always() && inputs.GERRIT_DISABLED != true }}
    needs: [clear-vote, sonatype-lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # workflow-conclusion queries the Actions API to list run jobs
      actions: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: 'Get conclusion'
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@7b146947e59eaf7fc3328822357861ab1758c088  # v2.2.5
      - name: 'Set vote'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
