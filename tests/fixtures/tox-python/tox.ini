# Fixture for the 'tox-python' job of workflow-tests.yaml. The
# environment carries no Python factor, so it runs on tox's
# default_base_python: the Python running tox unless the lane
# overrides it for a caller on Python older than 3.11.
[tox]
env_list = version-check

[testenv:version-check]
skip_install = true
pass_env = EXPECT_PYTHON
commands = python check_python.py
