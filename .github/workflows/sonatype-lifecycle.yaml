---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Sonatype Lifecycle (Nexus IQ) dependency scan.
#
#   gerrit-validate -> scan
#
# The scan evaluates resolved dependencies against Nexus IQ policy. For
# ecosystems where dependencies only resolve at build time (Maven,
# Gradle), an optional pre-scan build populates the workspace first via
# the build_type input; the build runs inside the scan job so both share
# a workspace without artefact plumbing. Go's build_type does not build
# the project either -- it runs 'go mod tidy' so go.sum fully reflects
# the dependency graph, then, per scan_mode, either scans go.sum
# directly (the default, 'cli') or generates a CycloneDX SBOM with
# cyclonedx-gomod and uploads it through the Nexus IQ REST API ('sbom').
# Both mirror the two branches ONAP's legacy Jenkins Go CLM jobs picked
# between via nexus-iq-use-cli; 'sbom' exists only for parity with
# projects that ran that branch, since it forgoes the policy gating
# 'cli' has (see scan_mode's own description). scan_mode is not itself
# Go-specific -- any ecosystem this lane can produce a CycloneDX SBOM
# for could reuse it -- but only the Go path drives it today.
#
# The build JDK and the Nexus IQ CLI runtime JDK are configured
# INDEPENDENTLY. IQ CLI 2.x requires Java 17, while projects frequently
# build with older JDKs; driving both from one version is what produced
# UnsupportedClassVersionError across the ONAP estate. java_version
# governs the build (auto-detected when unset) and iq_java_version the
# CLI.
#
# Credential handling has two paths, both optional. Where the caller can
# store a complete settings.xml as a repository secret, pass it as
# maven_global_settings. Where credentials vary per repository, supply
# the server shape as inputs plus a maven_server_password secret and the
# lane synthesises settings.xml with maven-xml-settings-action, in the
# same job as the build. Synthesising here rather than in the caller
# matters: a caller would have to route the document through a job
# output, and GitHub redacts outputs containing registered secrets, so
# the masked password would arrive as '***'.
#
# Nothing organisation-specific lives in this lane. The server ids,
# mirror and profile are all caller-supplied, and the username is an
# input rather than a secret so a caller can derive it (from a project
# name, say) and pass it without redaction concerns.
#
# Call this from a thin caller workflow; see examples/sonatype-lifecycle/
name: '[R] Sonatype Lifecycle 🔐'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out. Empty uses the triggering
          event's ref for same-repository checkouts, or the default
          branch when checking out a different repository.
        required: false
        type: string
        default: ''
      fetch_depth:
        description: >-
          Git history depth; 0 fetches all history for all branches and
          tags. CLM evaluates the dependency manifests on disk rather
          than commit history, so the shallow default costs nothing
          here; raise it for a build_type that inspects git state.
        required: false
        type: number
        default: 1
      submodules:
        description: >-
          Submodule checkout: 'false', 'true' or 'recursive'. Nexus IQ
          reports on whatever it was given, so a project whose
          dependency manifests live in a submodule needs this set or
          the scan passes having evaluated an incomplete tree. Caveat
          on the Gerrit path: the pinned checkout action refreshes
          submodules after moving to the change only for 'true', so
          'recursive' scans them as they stood at the branch tip; and
          it omits --init, so a submodule the change ADDS is left
          empty under either value. Tracked as
          lfreleng-actions/checkout-gerrit-change-action#142; this lane
          gains the fix when that action is repinned.
        required: false
        type: string
        default: 'false'

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Nexus IQ scan ---
      application_id:
        description: >-
          Organisation and project name in Nexus IQ. Empty derives
          <owner>-<name> from the repository actually under scan, which
          is the `repository` input when set and the calling repository
          otherwise.
        required: false
        type: string
        default: ''
      scan_targets:
        description: 'File(s) or folder(s) to scan'
        required: false
        type: string
        default: '.'
      iq_cli_version:
        description: >-
          Nexus IQ CLI version. Mirrors the scan action's own default;
          review when the pinned action version changes.
        required: false
        type: string
        default: '2.13.0-01'
      iq_java_version:
        description: >-
          Java runtime for the Nexus IQ CLI. Independent of java_version,
          which governs the pre-scan build. IQ CLI 2.x requires Java 17.
        required: false
        type: string
        default: '17'
      iq_java_distribution:
        description: 'JAVA SE distribution for the Nexus IQ CLI'
        required: false
        type: string
        default: 'temurin'
      advanced_properties:
        description: 'Additional properties passed to the Nexus IQ CLI'
        required: false
        type: string
        default: ''
      ignore_scanning_errors:
        description: 'Permit scanning errors without failing the job'
        required: false
        type: boolean
        default: false
      ignore_system_errors:
        description: 'Permit Nexus IQ system errors without failing'
        required: false
        type: boolean
        default: false
      fail_on_policy_warnings:
        description: 'Fail the job on policy warnings, not just failures'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable debug logging'
        required: false
        type: boolean
        default: false

      # --- Optional pre-scan build ---
      build_type:
        description: >-
          Pre-scan build to run: 'none', 'maven', 'gradle' or 'go'
        required: false
        type: string
        default: 'none'
      java_version:
        description: >-
          Java version for the pre-scan build. Empty auto-detects from
          the project, falling back to 21. Independent of
          iq_java_version, which governs the Nexus IQ CLI.
        required: false
        type: string
        default: ''
      java_distribution:
        description: 'JAVA SE distribution for the pre-scan build'
        required: false
        type: string
        default: 'temurin'
      build_permit_fail:
        description: >-
          Permit pre-scan build failures without failing the workflow.
          Defaults true, unlike other *_permit_fail inputs: a partial
          dependency tree still yields a useful scan, and blocking on
          the build would convert a build regression into a missing
          security signal.
        required: false
        type: boolean
        default: true
        # The build steps below spell this as
        # 'continue-on-error: ${{ inputs.build_permit_fail != false }}'
        # rather than referencing the input bare. GitHub evaluates
        # continue-on-error lazily, only once a step has actually
        # failed, and in that evaluation the input can arrive empty --
        # which continue-on-error rejects outright:
        #
        #   The template is not valid ... Unexpected value ''
        #
        # The comparison always yields a boolean literal, so the step
        # cannot collapse the run at the moment a build fails, which is
        # precisely when this lane is meant to carry on and scan.
        #
        # Note the SonarQube lane writes '== true' instead. That is not
        # an inconsistency: this input defaults true and that one
        # defaults false, and each form preserves its own default when
        # the value arrives empty.
      mvn_version:
        description: 'Maven version for the pre-scan build'
        required: false
        type: string
        default: '3.9.5'
      mvn_phases:
        description: 'Maven lifecycle phases for the pre-scan build'
        required: false
        type: string
        default: 'clean package'
      mvn_profiles:
        description: 'Comma-separated Maven profiles'
        required: false
        type: string
        default: ''
      mvn_params:
        description: 'Parameters passed to the mvn command'
        required: false
        type: string
        default: ''
      mvn_opts:
        description: 'MAVEN_OPTS for the pre-scan build'
        required: false
        type: string
        default: ''
      gradle_version:
        description: 'Gradle version for the pre-scan build'
        required: false
        type: string
        default: ''
      build_arguments:
        description: 'Arguments passed to the gradle command'
        required: false
        type: string
        default: 'build'
      scan_mode:
        description: >-
          How results reach Nexus IQ: 'cli' runs the Nexus IQ CLI's
          build analyser against scan_targets (or go.sum for Go).
          'sbom' instead generates a CycloneDX SBOM and uploads it
          through the Nexus IQ REST API directly, bypassing the CLI
          entirely -- mirroring legacy Jenkins Go CLM jobs with
          nexus-iq-use-cli: false. Only the Go path drives 'sbom'
          today, via cyclonedx-gomod. 'sbom' cannot gate on policy: the
          upload is fire-and-forget, so fail_on_policy_warnings,
          ignore_scanning_errors, ignore_system_errors, iq_cli_version,
          iq_java_version and iq_java_distribution all have no effect
          on it.
        required: false
        type: string
        default: 'cli'
      go_sbom_tool_version:
        description: >-
          cyclonedx-gomod version generating the SBOM. Only used when
          build_type is 'go' and scan_mode is 'sbom'.
        required: false
        type: string
        default: '1.10.0'
        # Not a commit-SHA pin like the uses: steps below: go install
        # resolves this through the module proxy, checksum-verified
        # against GOSUMDB rather than pinned to a specific content
        # hash in this file. Tightening further only makes sense if
        # cyclonedx-gomod stays in-lane rather than moving behind
        # sbom-action's own SHA pin (see issue #40).

      # --- Maven settings.xml synthesis (optional) ---
      # Supplying maven_server_ids turns these on. The lane then builds a
      # settings.xml with maven-xml-settings-action rather than expecting
      # the maven_global_settings secret.
      maven_server_ids:
        description: >-
          Maven server <id> values sharing one credential, comma, space
          or newline separated. Leave empty to skip synthesis and use
          the maven_global_settings secret instead.
        required: false
        type: string
        default: ''
      maven_server_username:
        description: >-
          Username applied to every synthesised server entry. An input
          rather than a secret, so a caller may derive it (from a
          project name, for example) and pass it without redaction.
        required: false
        type: string
        default: ''
      maven_mirror_id:
        description: 'Mirror <id>; requires maven_mirror_url to take effect'
        required: false
        type: string
        default: ''
      maven_mirror_url:
        description: 'Mirror <url>; requires maven_mirror_id to take effect'
        required: false
        type: string
        default: ''
      maven_mirror_of:
        description: 'Mirror <mirrorOf> selector'
        required: false
        type: string
        default: '*'
      maven_profile_id:
        description: >-
          Active profile <id>; requires maven_profile_repository_url
        required: false
        type: string
        default: ''
      maven_profile_repository_url:
        description: >-
          Repository URL for the active profile; requires
          maven_profile_id
        required: false
        type: string
        default: ''

      # --- Job timeout ---
      timeout_minutes:
        description: 'Timeout (minutes) for the scan job'
        required: false
        type: number
        default: 45

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode, permitting unrestricted
          egress. Use when a pre-scan build fetches dependencies from
          CDNs that are impractical to enumerate in the allow-list.
          Unlike the build-test workflows, where the build is a separate
          job, this lane runs the build inside the scan job, so the
          exemption covers the whole job.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@f0f76ac22f342c9a788ebcabe584e68a79cc2e83'  # v0.16.0

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      nexus_iq_password:
        description: 'Nexus IQ password'
        required: true
      maven_server_password:
        description: >-
          Password applied to every synthesised Maven server entry. Used
          only when maven_server_ids is set.
        required: false
      maven_global_settings:
        description: >-
          A complete Maven settings.xml for the pre-scan build, as an
          alternative to synthesising one from the maven_* inputs. It
          carries repository credentials, so it is a secret rather than
          an input. Store the whole document as a repository secret
          rather than routing it through a job output, which GitHub
          redacts when it contains registered secrets.
        required: false

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message when inputs are inconsistent. The
    # scan job depends on this, so invalid input stops the pipeline
    # early and cleanly. This job always runs (only the validation steps
    # are conditional), so gating dependents on it does not trip
    # GitHub's "skipped need skips dependents" behaviour.
    #
    # The job carries no harden-runner step by design: it performs pure
    # input-string validation with no checkout, artifacts or network
    # access, and loading the egress allow-list would itself add an
    # outbound call.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: later steps cd
          # into it and derive scan targets from it, so an empty value,
          # absolute paths or .. segments could escape the checkout.
          # A single trailing slash is tolerated ('./' == '.').
          PATH_PREFIX="${PATH_PREFIX%/}"
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Validate fetch_depth input'
        shell: bash
        env:
          FETCH_DEPTH: ${{ inputs.fetch_depth }}
        run: |
          # actions/checkout treats a negative or non-integer depth as a
          # git error deep inside the checkout, long after the job has
          # hardened and started. 0 is legitimate and means full
          # history; the default here is 1.
          if ! [[ "${FETCH_DEPTH}" =~ ^[0-9]+$ ]]; then
            echo "::error::fetch_depth must be a non-negative integer" \
              "(received: '${FETCH_DEPTH}')"
            exit 1
          fi

      - name: 'Validate submodules input'
        shell: bash
        env:
          SUBMODULES: ${{ inputs.submodules }}
        run: |
          # actions/checkout treats any unrecognised value as false,
          # so a typo would silently leave submodule sources out of
          # the scan.
          case "${SUBMODULES}" in
            true | false | recursive) ;;
            *)
              echo "::error::submodules must be 'true', 'false' or" \
                "'recursive' (received: '${SUBMODULES}')"
              exit 1
              ;;
          esac

      - name: 'Validate build_type input'
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          # Reject typos early: an unrecognised build_type would
          # otherwise skip the build stage silently and scan an
          # unpopulated workspace.
          case "${BUILD_TYPE}" in
            none | maven | gradle | go) ;;
            *)
              echo "::error::build_type must be 'none', 'maven'," \
                "'gradle' or 'go' (received: '${BUILD_TYPE}')"
              exit 1
              ;;
          esac

      - name: 'Validate scan_mode input'
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          # Only build_type: go drives 'sbom' today, but validated
          # unconditionally like build_type itself.
          case "${SCAN_MODE}" in
            cli | sbom) ;;
            *)
              echo "::error::scan_mode must be 'cli' or 'sbom'" \
                "(received: '${SCAN_MODE}')"
              exit 1
              ;;
          esac
          # Every 'sbom'-mode step is gated on build_type == 'go'; a
          # non-Go build_type would pass validation, generate and
          # upload nothing, then silently fall through to a CLI scan
          # instead. Remove once #40 generalises 'sbom' beyond Go.
          if [ "${SCAN_MODE}" = 'sbom' ] && [ "${BUILD_TYPE}" != 'go' ]; then
            echo "::error::scan_mode 'sbom' currently requires" \
              "build_type 'go' (received build_type: '${BUILD_TYPE}')"
            exit 1
          fi

      - name: 'Validate timeout_minutes input'
        shell: bash
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          # GitHub permits 1-360 minutes; an out-of-range value fails
          # the run with an opaque scheduling error.
          if ! [[ "${TIMEOUT_MINUTES}" =~ ^[0-9]+$ ]] \
            || [ "${TIMEOUT_MINUTES}" -lt 1 ] \
            || [ "${TIMEOUT_MINUTES}" -gt 360 ]; then
            echo "::error::timeout_minutes must be an integer 1-360" \
              "(received: '${TIMEOUT_MINUTES}')"
            exit 1
          fi

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo 'Gerrit inputs validated ✅'

  scan:
    name: 'Scan'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      # The workflow checks out the repository under analysis.
      contents: read
    steps:
      # This lane runs any pre-scan build inside the scan job, so the
      # build_permit_egress_traffic exemption necessarily covers the
      # whole job rather than a separate build job. Left unset, the job
      # follows harden_runner_egress like every other job.
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre' entry
      # point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both engaged, the first won, and audit
      # mode was unreachable however the caller asked for it.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
          fetch-depth: ${{ inputs.fetch_depth }}
          submodules: ${{ inputs.submodules }}

      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.fetch_depth }}
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      # Detect the project's Java or Go version so the pre-scan build
      # uses the toolchain the project expects, rather than whatever
      # the Nexus IQ CLI needs.
      - name: 'Gather build metadata'
        id: metadata
        # yamllint disable-line rule:line-length
        if: inputs.build_type == 'maven' || inputs.build_type == 'gradle' || inputs.build_type == 'go'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@504ee845e954566de1d220137fd40635e15468a9  # v0.8.0
        with:
          path_prefix: ${{ inputs.path_prefix }}

      # Synthesise a settings.xml when the caller supplies server ids,
      # rather than expecting a pre-built document. This runs in the same
      # job as the build deliberately: the alternative, synthesising in a
      # caller job and forwarding the result, would route the document
      # through a job output, and GitHub redacts outputs containing
      # registered secrets, so the password would arrive as '***'.
      - name: 'Synthesise Maven settings'
        id: settings
        # yamllint disable-line rule:line-length
        if: ${{ inputs.build_type == 'maven' && inputs.maven_server_ids != '' }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-xml-settings-action@e40c793acc0f688303943189858c0645ba906881  # v0.1.0
        with:
          server-ids: ${{ inputs.maven_server_ids }}
          username: ${{ inputs.maven_server_username }}
          password: ${{ secrets.maven_server_password }}
          mirror-id: ${{ inputs.maven_mirror_id }}
          mirror-url: ${{ inputs.maven_mirror_url }}
          mirror-of: ${{ inputs.maven_mirror_of }}
          profile-id: ${{ inputs.maven_profile_id }}
          profile-repository-url: ${{ inputs.maven_profile_repository_url }}

      # Populate the workspace with resolved dependencies before
      # scanning. An explicit java_version wins, then project detection,
      # then 21 as the floor.
      - name: 'Build with Maven'
        if: inputs.build_type == 'maven'
        # yamllint disable-line rule:line-length
        continue-on-error: ${{ inputs.build_permit_fail != false }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-build-action@4fe48909bcb696f286d83b197d84fbb64b4e020e  # v0.4.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          # yamllint disable-line rule:line-length
          java-version: ${{ inputs.java_version != '' && inputs.java_version || steps.metadata.outputs.java_version || '21' }}
          distribution: ${{ inputs.java_distribution }}
          mvn-version: ${{ inputs.mvn_version }}
          mvn-phases: ${{ inputs.mvn_phases }}
          mvn-profiles: ${{ inputs.mvn_profiles }}
          mvn-params: ${{ inputs.mvn_params }}
          mvn-opts: ${{ inputs.mvn_opts }}
          # A synthesised document wins; otherwise fall back to a
          # complete settings.xml supplied as a secret.
          # yamllint disable-line rule:line-length
          global-settings: ${{ steps.settings.outputs.settings-content || secrets.maven_global_settings }}
          run-jacoco: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build with Gradle'
        if: inputs.build_type == 'gradle'
        # yamllint disable-line rule:line-length
        continue-on-error: ${{ inputs.build_permit_fail != false }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gradle-build-action@1b4ea0f67a3632b0e2fb427fb2af52704ae57849  # v0.6.0
        with:
          # gradle-build-action names this 'path', not 'path_prefix'
          path: ${{ inputs.path_prefix }}
          # yamllint disable-line rule:line-length
          java-version: ${{ inputs.java_version != '' && inputs.java_version || steps.metadata.outputs.java_version || '21' }}
          distribution: ${{ inputs.java_distribution }}
          gradle-version: ${{ inputs.gradle_version }}
          build-arguments: ${{ inputs.build_arguments }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup Go'
        if: inputs.build_type == 'go'
        # yamllint disable-line rule:line-length
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.metadata.outputs.go_go_version }}
          # setup-go prefers go-version when both are set; this is a
          # defensive fallback should build-metadata-action ever fail
          # to resolve a version and still report success
          # yamllint disable-line rule:line-length
          go-version-file: ${{ format('{0}/go.mod', inputs.path_prefix) }}
          cache: false

      # Nothing here compiles the project: 'go mod tidy' resolves and
      # prunes go.sum so it fully reflects the dependency graph before
      # the scan reads it, either as the CLI's target directly ('cli')
      # or as cyclonedx-gomod's input ('sbom'). No continue-on-error:
      # a failed tidy leaves go.sum stale or incomplete, and scanning
      # that would be worse than failing outright.
      - name: 'Go mod tidy'
        if: inputs.build_type == 'go'
        shell: bash
        working-directory: ${{ inputs.path_prefix }}
        run: |
          go mod tidy
          # A tidy go.sum can still be empty for a dependency-free
          # module; scanning that silently would look identical to a
          # broken resolution, so fail loudly instead either way.
          if [ ! -s go.sum ]; then
            echo "::error::go.sum is empty after 'go mod tidy'"
            exit 1
          fi

      # Only scan_mode: 'sbom' needs an SBOM; 'cli' scans go.sum
      # directly. Version-pinned rather than @latest, unlike the legacy
      # Jenkins script, per this repository's pinning policy for
      # anything a lane installs and runs. No continue-on-error, to
      # match 'Go mod tidy' above: a failed generation should not fall
      # through to uploading a missing or stale bom.xml.
      - name: 'Generate Go SBOM'
        if: inputs.build_type == 'go' && inputs.scan_mode == 'sbom'
        shell: bash
        working-directory: ${{ inputs.path_prefix }}
        env:
          GOMOD_VERSION: ${{ inputs.go_sbom_tool_version }}
        run: |
          gomod_pkg='github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod'
          go install "${gomod_pkg}@v${GOMOD_VERSION}"
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -output bom.xml \
            -output-version 1.5
          if [ ! -s bom.xml ]; then
            echo "::error::bom.xml is empty after cyclonedx-gomod"
            exit 1
          fi

      # Derive the Nexus IQ application id from the repository actually
      # under scan. The scan action defaults it from the calling
      # repository, which is wrong whenever `repository` points
      # elsewhere, so resolve it here rather than relying on that.
      - name: 'Resolve Nexus IQ application id'
        id: application
        shell: bash
        env:
          APPLICATION_ID: ${{ inputs.application_id }}
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # An explicit application_id always wins; otherwise derive
          # <owner>-<name> from the repository under scan.
          app_id="${APPLICATION_ID}"
          if [ -z "${app_id}" ]; then
            app_id="${TARGET_REPOSITORY//\//-}"
          fi
          echo "id=${app_id}" >> "$GITHUB_OUTPUT"
          echo "Nexus IQ application id: ${app_id}"

      # scan_mode: 'sbom' only. Mirrors the legacy Jenkins REST
      # branch: the upload endpoint needs Nexus IQ's internal
      # application id, a UUID distinct from the publicId resolved
      # above, so look that up first, then upload the SBOM. Nexus IQ
      # evaluates the upload asynchronously, so this cannot gate on
      # policy the way the CLI does -- see scan_mode's description. No
      # continue-on-error, for the same reason as the two steps above.
      - name: 'Upload Go SBOM to Nexus IQ (REST API)'
        if: inputs.build_type == 'go' && inputs.scan_mode == 'sbom'
        shell: bash
        working-directory: ${{ inputs.path_prefix }}
        env:
          NEXUS_IQ_SERVER: ${{ vars.NEXUS_IQ_SERVER }}
          NEXUS_IQ_USERNAME: ${{ vars.NEXUS_IQ_USERNAME }}
          NEXUS_IQ_PASSWORD: ${{ secrets.nexus_iq_password }}
          PUBLIC_ID: ${{ steps.application.outputs.id }}
        run: |
          set -euo pipefail

          # A curl config file keeps the credentials out of argv, where
          # a process listing on the runner could otherwise read them.
          # The trap covers early exits below as well as normal exit.
          curl_config="$(mktemp "${RUNNER_TEMP}/nexus-iq-curl.XXXXXXXXXX")"
          trap 'rm -f "${curl_config}"' EXIT
          printf 'user = "%s:%s"\n' \
            "${NEXUS_IQ_USERNAME}" "${NEXUS_IQ_PASSWORD}" > "${curl_config}"

          app_uuid="$(curl -sS -f -K "${curl_config}" \
            "${NEXUS_IQ_SERVER}/api/v2/applications?publicId=${PUBLIC_ID}" \
            | jq -r '.applications[0].id // empty')"
          if [ -z "${app_uuid}" ]; then
            echo "::error::No Nexus IQ application found for" \
              "publicId '${PUBLIC_ID}'"
            exit 1
          fi

          upload_url="${NEXUS_IQ_SERVER}/api/v2/scan/applications"
          upload_url="${upload_url}/${app_uuid}/sources/cyclonedx"
          curl -sS -f -K "${curl_config}" -X POST \
            -H 'Content-Type: application/xml' \
            --data '@bom.xml' "${upload_url}"

      # no_checkout is 'true' because this workflow has already checked
      # out, via whichever of the two paths above applied.
      - name: 'Sonatype Lifecycle scan'
        # scan_mode: 'sbom' uploads directly via REST above instead.
        if: inputs.build_type != 'go' || inputs.scan_mode != 'sbom'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sonatype-lifecycle-scan-action@f5b35cbd1c76597611c426e7e788c147e11c8e98  # v0.2.0
        with:
          nexus_iq_server: ${{ vars.NEXUS_IQ_SERVER }}
          nexus_iq_username: ${{ vars.NEXUS_IQ_USERNAME }}
          nexus_iq_password: ${{ secrets.nexus_iq_password }}
          java_distribution: ${{ inputs.iq_java_distribution }}
          java_version: ${{ inputs.iq_java_version }}
          iq_cli_version: ${{ inputs.iq_cli_version }}
          application_id: ${{ steps.application.outputs.id }}
          # The Go path always scans go.sum rather than the source
          # tree; scan_targets is a Maven/Gradle/none concern there, so
          # it takes no caller input for Go.
          # yamllint disable-line rule:line-length
          scan_targets: ${{ inputs.build_type == 'go' && format('{0}/go.sum', inputs.path_prefix) || inputs.scan_targets }}
          advanced_properties: ${{ inputs.advanced_properties }}
          ignore_scanning_errors: ${{ inputs.ignore_scanning_errors }}
          ignore_system_errors: ${{ inputs.ignore_system_errors }}
          fail_on_policy_warnings: ${{ inputs.fail_on_policy_warnings }}
          debug: ${{ inputs.debug }}
          no_checkout: 'true'
