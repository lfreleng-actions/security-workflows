---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# GitHub Actions pin audit.
#
#   validate -> audit
#
# Verifies that every `uses:` coordinate in a repository's workflows and
# composite actions resolves, and that it names a commit SHA rather than
# a tag or branch. A tag or branch is mutable: whoever controls the
# upstream repository can repoint it at different code after review, so
# an unpinned `uses:` is an unreviewed supply-chain dependency.
#
# The lane wraps pinned-versions-action, itself a thin wrapper around
# the gha-workflow-linter tool. Nothing between the caller and the
# linter belongs here; the lane exists to supply a hardened runner, a
# Gerrit-aware checkout and the house input vocabulary.
#
# The lane GATES: findings fail the job. There is deliberately no
# *_permit_fail escape hatch, unlike package-hardening-audit; see
# docs/BRIEF.md D19.
#
# The linter runs under uvx, so runs_on must name a Linux or macOS
# runner. Windows is not supported.
#
# Call this from a thin caller workflow; see examples/action-pin-audit/
name: '[R] Action Pin Audit 📌'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out. Empty checks out the pull
          request head on pull_request events when auditing the
          calling repository, and otherwise uses the triggering
          event's ref for same-repository checkouts or the default
          branch when checking out a different repository.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the repository root to audit'
        required: false
        type: string
        default: '.'

      # --- Audit configuration ---
      full_scan:
        description: >-
          Scan every workflow and composite action, even on
          pull_request events. Left false, a pull request scans only
          the workflow files it changed, which keeps the check
          proportionate on repositories that have not yet reached zero
          findings.
        required: false
        type: boolean
        default: false
      linter_version:
        description: >-
          gha-workflow-linter version to install from PyPI (for
          example '1.0.2'). Empty resolves the latest release on each
          run; pin it where a reproducible audit matters more than
          picking up new rules automatically.
        required: false
        type: string
        default: ''

      # --- Runner selection and timeout ---
      runs_on:
        description: 'Runner label for the audit job (Linux or macOS)'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Timeout (minutes) for the audit job'
        required: false
        type: number
        default: 10

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@bf6642f68d58c1b81bbe993e676d6cc339ac3654'  # v0.12.2

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL
          repository variable at runtime.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message when inputs are inconsistent. The
    # audit job depends on this, so invalid input stops the pipeline
    # early and cleanly. This job always runs (only the validation steps
    # are conditional), so gating dependents on it does not trip
    # GitHub's "skipped need skips dependents" behaviour.
    #
    # The job carries no harden-runner step by design: it performs pure
    # input-string validation with no checkout, artifacts or network
    # access, and loading the egress allow-list would itself add an
    # outbound call.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: the linter walks
          # this directory, so an empty value, absolute paths or ..
          # segments could reach outside the checkout. A single
          # trailing slash is tolerated ('./' == '.').
          PATH_PREFIX="${PATH_PREFIX%/}"
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Validate linter_version input'
        if: inputs.linter_version != ''
        shell: bash
        env:
          LINTER_VERSION: ${{ inputs.linter_version }}
        run: |
          # The value becomes part of a uvx '--from' specifier. The
          # action validates it too, but only after setup-uv has run,
          # so catching it here saves a minute and reports against the
          # input rather than an internal step.
          if ! printf '%s' "${LINTER_VERSION}" | \
            grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$'; then
            echo "::error::linter_version contains invalid characters" \
              "(received: '${LINTER_VERSION}')"
            exit 1
          fi

      - name: 'Validate runs_on input'
        shell: bash
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          # The linter runs under uvx through bash steps. A Windows
          # runner fails partway through the composite action with a
          # shell error that does not name the cause.
          case "${RUNS_ON}" in
            '')
              echo "::error::runs_on must not be empty"
              exit 1
              ;;
            *windows* | *Windows* | *WINDOWS*)
              echo "::error::runs_on must name a Linux or macOS" \
                "runner; the linter requires bash and uvx" \
                "(received: '${RUNS_ON}')"
              exit 1
              ;;
          esac

      - name: 'Validate timeout_minutes input'
        shell: bash
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          # GitHub permits 1-360 minutes; an out-of-range value fails
          # the run with an opaque scheduling error.
          if ! [[ "${TIMEOUT_MINUTES}" =~ ^[0-9]+$ ]] \
            || [ "${TIMEOUT_MINUTES}" -lt 1 ] \
            || [ "${TIMEOUT_MINUTES}" -gt 360 ]; then
            echo "::error::timeout_minutes must be an integer 1-360" \
              "(received: '${TIMEOUT_MINUTES}')"
            exit 1
          fi

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo 'Gerrit inputs validated ✅'

  audit:
    name: 'Audit action pins'
    needs: validate
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      # The bare minimum: check out the repository under audit. The
      # linter resolves `uses:` coordinates against the public GitHub
      # API with the job token and publishes nothing.
      contents: read
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre' entry
      # point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both engaged, the first won, and audit
      # mode was unreachable however the caller asked for it.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          ref: refs/heads/${{ inputs.gerrit_branch }}

      # The lane owns the checkout so the Gerrit and cross-repository
      # paths above are possible at all, and passes no_checkout to the
      # action below. An empty ref on a pull_request resolves to the
      # head SHA, matching what the action checks out when left to
      # itself: auditing the merge ref would report pins from the base
      # branch that the change never touched. That default applies only
      # when auditing the calling repository, because a pull request
      # head SHA does not exist in a different one.
      - name: 'Checkout repository under audit'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # yamllint disable-line rule:line-length
          ref: ${{ inputs.ref != '' && inputs.ref || ((inputs.repository == '' || inputs.repository == github.repository) && github.event_name == 'pull_request' && github.event.pull_request.head.sha || '') }}
          persist-credentials: false

      - name: 'Audit action pins'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pinned-versions-action@260e7b940fdf0f0c02b8ff6c7cce2dbeb5c7e7a8  # v0.2.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          full_scan: ${{ inputs.full_scan }}
          linter_version: ${{ inputs.linter_version }}
          # Workspace already populated by the checkout above; skip the
          # action's own checkout so it does not discard a Gerrit change
          # or a cross-repository target.
          no_checkout: 'true'
