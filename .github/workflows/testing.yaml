# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the security lanes in this repository against fixture
# repositories. Lanes are referenced by LOCAL path, so this always
# validates the current branch.
#
# The self-test runs on workflow_dispatch ONLY. The lanes need
# organisation credentials (NEXUS_IQ_SERVER, NEXUS_IQ_USERNAME and the
# NEXUS_IQ_PASSWORD and SONAR_TOKEN secrets) which are unavailable to
# pull requests raised from forks, so a pull_request trigger would fail
# for outside contributors rather than reporting anything useful.
# Trigger it manually to validate a candidate branch.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Scan a Maven fixture with a pre-scan build, which exercises the
  # build stage, the independent build/CLI JDK resolution and the scan
  # itself. Audit egress because a real Maven build reaches artifact
  # CDNs beyond the allow-listed toolchain set.
  sonatype-lifecycle-maven:
    name: 'Sonatype Lifecycle (Maven)'
    permissions:
      contents: read
    uses: ./.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      build_type: 'maven'
      mvn_params: '-DskipTests'
      harden_runner_egress: 'audit'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Scan without a build, which is the path most non-JVM projects take.
  sonatype-lifecycle-scan-only:
    name: 'Sonatype Lifecycle (scan only)'
    permissions:
      contents: read
    uses: ./.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-node-project'
      build_type: 'none'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Cover the Go path: 'go mod tidy' resolves go.sum, then the scan
  # targets go.sum directly rather than the source tree. Audit egress
  # because module downloads reach proxy.golang.org, beyond the
  # allow-listed toolchain set.
  sonatype-lifecycle-go:
    name: 'Sonatype Lifecycle (Go)'
    permissions:
      contents: read
    uses: ./.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      build_type: 'go'
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Cover the Go REST-API path: generates a cyclonedx-gomod SBOM and
  # uploads it directly instead of running the CLI scan action. Relies
  # on the same fixture already having an application registered in
  # Nexus IQ from the 'cli' job above; the lookup step fails fast with
  # a clear error otherwise, rather than the API silently creating one.
  sonatype-lifecycle-go-sbom:
    name: 'Sonatype Lifecycle (Go, REST API)'
    needs: sonatype-lifecycle-go
    permissions:
      contents: read
    uses: ./.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      build_type: 'go'
      scan_mode: 'sbom'
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Exercise the SonarQube Cloud lane's build stage, which is where the
  # lane does its own work; the scan itself is the action's concern.
  # Audit egress because a real Maven build reaches artifact CDNs beyond
  # the allow-listed toolchain set.
  sonarqube-cloud-maven:
    name: 'SonarQube Cloud (Maven)'
    permissions:
      contents: read
    uses: ./.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      build_type: 'maven'
      build_permit_egress_traffic: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # Cover the non-JVM build path: a different action, a different
  # coverage artefact, and the same continue-on-error plumbing.
  sonarqube-cloud-go:
    name: 'SonarQube Cloud (Go)'
    permissions:
      contents: read
    uses: ./.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      build_type: 'go'
      build_permit_egress_traffic: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # Scan with no build stage at all, which is the path generic and
  # JavaScript projects take.
  sonarqube-cloud-scan-only:
    name: 'SonarQube Cloud (scan only)'
    permissions:
      contents: read
    uses: ./.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-node-project'
      build_type: 'none'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # Audit this repository's own workflows. Exercises the lane against a
  # known-clean target, so a finding here means the lane regressed
  # rather than the target did. upload_sarif stays false: publishing is
  # gated to default-branch pushes and this is a workflow_dispatch.
  zizmor-self:
    name: 'Zizmor (self)'
    permissions:
      contents: read
    uses: ./.github/workflows/zizmor.yaml

  # Audit a fixture repository, which also covers the cross-repository
  # checkout path and the summary attribution inputs that go with it.
  zizmor-fixture:
    name: 'Zizmor (fixture)'
    permissions:
      contents: read
    uses: ./.github/workflows/zizmor.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      persona: 'regular'

  # Advisory run against this repository. audit_permit_fail is left at
  # its default so a finding reports without failing the self-test.
  package-hardening-self:
    name: 'Package Hardening (self)'
    permissions:
      contents: read
    uses: ./.github/workflows/package-hardening-audit.yaml
    with:
      cooldown_strategy: 'dependabot'

  # Exercise the Scorecard lane's analysis and plumbing WITHOUT touching
  # the published record. publish_results is off because this runs on
  # workflow_dispatch, which upstream treats as experimental, and a test
  # run should not overwrite the repository's real published score.
  #
  # The lane's compliance with the Scorecard API's workflow restrictions
  # is therefore NOT covered here: publishing is the only thing those
  # rules gate. openssf-scorecard-self.yaml is the integration test for
  # that, and it runs on every push to the default branch.
  openssf-scorecard-dry-run:
    name: 'OpenSSF Scorecard (dry run)'
    permissions:
      contents: read
    uses: ./.github/workflows/openssf-scorecard.yaml
    with:
      publish_results: false
      upload_sarif: false
      summary_enabled: false

  # Exercise the CodeQL lane's matrix construction, which is the part
  # this repository owns; the analysis itself belongs to the action.
  # Two languages confirm the matrix fans out and that artifact names
  # stay unique across jobs.
  #
  # upload is 'never' so a self-test does not file alerts against this
  # repository, and upload_database is off for the same reason.
  codeql-matrix:
    name: 'CodeQL (matrix)'
    permissions:
      contents: read
      packages: read  # fetch internal or private CodeQL packs
    uses: ./.github/workflows/codeql.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      languages: 'python,actions'
      upload: 'never'
      upload_database: false

  # Audit this repository's own action pins. full_scan is explicit
  # rather than relying on a workflow_dispatch having no changed-file
  # set to narrow to, so the self-test stays a whole-repository check
  # regardless of how the action treats non-pull_request events. The
  # target must be clean: this repository pins every `uses:` by commit
  # SHA, so a finding here means the lane regressed rather than the
  # target did.
  action-pin-audit-self:
    name: 'Action Pin Audit (self)'
    permissions:
      contents: read
    uses: ./.github/workflows/action-pin-audit.yaml
    with:
      full_scan: true

  # Exercise the cross-repository checkout path against a fixture, which
  # is the only part of the lane the self-scan above leaves uncovered.
  action-pin-audit-fixture:
    name: 'Action Pin Audit (fixture)'
    permissions:
      contents: read
    uses: ./.github/workflows/action-pin-audit.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      full_scan: true
