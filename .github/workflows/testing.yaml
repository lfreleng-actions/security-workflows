---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the security lanes in this repository against fixture
# repositories. Lanes are referenced with the self-repository form
# ('$/'), which resolves this repository at the commit already
# running, so the lanes under test are always the ones this branch
# defines.
#
# The self-test runs on workflow_dispatch ONLY. The lanes need
# organisation credentials (NEXUS_IQ_SERVER, NEXUS_IQ_USERNAME and the
# NEXUS_IQ_PASSWORD and SONAR_TOKEN secrets) which are unavailable to
# pull requests raised from forks, so a pull_request trigger would fail
# for outside contributors rather than reporting anything useful.
# Trigger it manually to validate a candidate branch.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

# One run at a time across ALL refs, and never cancelled mid-flight.
# Every credentialled leg scans into a server-side project shared by
# every run -- a Nexus IQ application, a Sonar project -- so two runs
# overlapping, from any two branches, could each read the other's
# result. Cancelling is no protection: a cancelled scan's analysis can
# still finish processing on the server after its replacement starts.
# A new dispatch queues behind the one in flight instead.
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

permissions: {}

jobs:
  # Scan a Maven fixture with a pre-scan build, which exercises the
  # build stage, the independent build/CLI JDK resolution and the scan
  # itself. Audit egress because a real Maven build reaches artifact
  # CDNs beyond the allow-listed toolchain set.
  sonatype-lifecycle-maven:
    name: 'Sonatype Lifecycle (Maven)'
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      build_type: 'maven'
      mvn_params: '-DskipTests'
      harden_runner_egress: 'audit'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Scan without a build, which is the path most non-JVM projects take.
  sonatype-lifecycle-scan-only:
    name: 'Sonatype Lifecycle (scan only)'
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-node-project'
      build_type: 'none'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Exercise the checkout inputs rather than the scan. fetch_depth and
  # submodules are validated, then handed to actions/checkout, and a
  # fault in that plumbing surfaces as a scan of an incomplete tree
  # rather than as an error -- so a run that merely completes is worth
  # having only because the alternative is no coverage at all. Both
  # values are non-default, so the job proves the inputs travel rather
  # than that their defaults do. Sequenced behind the scan-only job
  # because both target the same fixture, and so the same Nexus IQ
  # application.
  #
  # This covers the plumbing, NOT the resulting tree: test-node-project
  # carries no submodule, so nothing here can catch one silently
  # missing from the scan. The submodule-* jobs at the end of this file
  # do, against a fixture built for it.
  sonatype-lifecycle-checkout-inputs:
    name: 'Sonatype Lifecycle (checkout inputs)'
    needs: sonatype-lifecycle-scan-only
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-node-project'
      build_type: 'none'
      fetch_depth: 0
      submodules: 'recursive'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Cover the Go path: with go_scan_target at its 'list' default, the
  # lane generates go.list from the dependencies the build resolves
  # and points the scan at that file rather than the source tree. No
  # 'go mod tidy' runs here. go.sum still matters -- 'go list' verifies
  # checksums against it while resolving -- but it is neither tidied
  # nor analysed. Audit egress because module downloads reach
  # proxy.golang.org, beyond the allow-listed toolchain set.
  # Resolve the Go fixture to one commit, up front. The Go legs and
  # the assertion below each check the fixture out independently, so
  # on a moving default branch they could read different trees: the
  # lanes would report versions resolved from one go.mod while the
  # assertion compares them against another, giving a false mismatch
  # or a wrong skip. Most likely to bite exactly when the pending
  # toolchain edit lands, which is when the check starts to matter.
  go-fixture-ref:
    name: 'Resolve Go fixture commit'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Resolve default branch head'
        id: resolve
        shell: bash
        env:
          FIXTURE: 'lfreleng-actions/test-go-project'
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${FIXTURE}.git" \
            refs/heads/main | cut -f1)"
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve ${FIXTURE} refs/heads/main"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${FIXTURE} pinned at ${sha}"

  sonatype-lifecycle-go:
    name: 'Sonatype Lifecycle (Go)'
    needs: go-fixture-ref
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      ref: ${{ needs.go-fixture-ref.outputs.sha }}
      build_type: 'go'
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # The job above takes the go_scan_target default, so it covers the
  # go.list path only. This one covers the legacy-parity path a project
  # mid-cutover pins: a different scan target filename, and the branch
  # where 'Go mod tidy' still runs. Both are conditional, so neither is
  # exercised by the default leg.
  #
  # Chained rather than parallel: every Go leg scans the same derived
  # Nexus IQ application, and the job above is what registers it.
  sonatype-lifecycle-go-sum:
    name: 'Sonatype Lifecycle (Go, go.sum)'
    needs: [go-fixture-ref, sonatype-lifecycle-go]
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      ref: ${{ needs.go-fixture-ref.outputs.sha }}
      build_type: 'go'
      go_scan_target: 'sum'
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Cover the Go REST-API path: generates a cyclonedx-gomod SBOM and
  # uploads it directly instead of running the CLI scan action. Relies
  # on the same fixture already having an application registered in
  # Nexus IQ from the 'cli' jobs above; the lookup step fails fast with
  # a clear error otherwise, rather than the API silently creating one.
  #
  # Last in the Go chain, not merely after the first leg: the upload is
  # asynchronous, so letting it run alongside another scan of the same
  # application would interleave results for no gain.
  sonatype-lifecycle-go-sbom:
    name: 'Sonatype Lifecycle (Go, REST API)'
    needs: [go-fixture-ref, sonatype-lifecycle-go-sum]
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      ref: ${{ needs.go-fixture-ref.outputs.sha }}
      build_type: 'go'
      scan_mode: 'sbom'
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Cover build_type 'python' through its uv.lock branch, which is the
  # fixture's shape and the one the estate is moving to. The other two
  # branches -- requirements.txt and bare project metadata -- were
  # verified against the O-RAN-SC projects that motivated the build
  # type, and the no-manifest rejection runs on every PR in
  # tests/workflow-steps.sh. Audit egress: resolution reaches PyPI and
  # uv's interpreter downloads.
  sonatype-lifecycle-python:
    name: 'Sonatype Lifecycle (Python)'
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      build_type: 'python'
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  # Exercise the SonarQube Cloud lane's build stage, which is where the
  # lane does its own work; the scan itself is the action's concern.
  # Audit egress because a real Maven build reaches artifact CDNs beyond
  # the allow-listed toolchain set.
  #
  # mvn_pom_file is set to Maven's own default rather than left empty,
  # so the input travels end to end at no extra cost: it is validated,
  # reaches maven-build-action, and is assembled into the '-f' argument
  # handed to sonar-maven-plugin. It guards against breaking Maven
  # analysis mode, which is the failure this input's plumbing is most
  # likely to cause, but it cannot detect a forwarding regression:
  # 'pom.xml' is what both the build and the analysis would pick
  # anyway, so removing the plumbing leaves this leg green. Proving a
  # NON-default filename travels needs a fixture that has one. The
  # other Maven legs leave the input empty, covering the unset path.
  sonarqube-cloud-maven:
    name: 'SonarQube Cloud (Maven)'
    permissions:
      contents: read
    uses: $/.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      build_type: 'maven'
      mvn_pom_file: 'pom.xml'
      build_permit_egress_traffic: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # The same fixture through the other analysis backend. CLI mode
  # never reads the Maven project model, so it is the mode
  # coverage_report_paths exists for: without it a reactor's coverage
  # rests on a default glob. Sequenced behind the maven-mode leg
  # because both analyse the same Sonar project, and concurrent
  # analyses of one project race.
  #
  # This exercises the wiring; it does NOT prove the value decided
  # anything. test-maven-project declares
  # sonar.coverage.jacoco.xmlReportPaths in its own
  # sonar-project.properties, deliberately, so the CLI scanner finds
  # reactor coverage whether or not the lane forwards the build's
  # paths. Discriminating needs a fixture without that property, or
  # an assertion on the analysis log. See #77.
  sonarqube-cloud-maven-cli:
    name: 'SonarQube Cloud (Maven, CLI analysis)'
    needs: sonarqube-cloud-maven
    permissions:
      contents: read
    uses: $/.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      build_type: 'maven'
      analysis_mode: 'cli'
      build_permit_egress_traffic: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # Cover the non-JVM build path: a different action, a different
  # coverage artefact, and the same continue-on-error plumbing.
  #
  # NOTE: test-go-project's go.mod declares a 'go' directive and no
  # 'toolchain' directive, so neither this leg nor the CLM lane's Go
  # legs exercise toolchain selection at all. See #75.
  sonarqube-cloud-go:
    name: 'SonarQube Cloud (Go)'
    needs: go-fixture-ref
    permissions:
      contents: read
    uses: $/.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      ref: ${{ needs.go-fixture-ref.outputs.sha }}
      build_type: 'go'
      build_permit_egress_traffic: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # Scan with no build stage at all, which is the path generic and
  # JavaScript projects take.
  sonarqube-cloud-scan-only:
    name: 'SonarQube Cloud (scan only)'
    permissions:
      contents: read
    uses: $/.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-node-project'
      build_type: 'none'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # Audit this repository's own workflows. Exercises the lane against a
  # known-clean target, so a finding here means the lane regressed
  # rather than the target did. upload_sarif stays false: publishing is
  # gated to default-branch pushes and this is a workflow_dispatch.
  zizmor-self:
    name: 'Zizmor (self)'
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yaml

  # Audit a fixture repository, which also covers the cross-repository
  # checkout path and the summary attribution inputs that go with it.
  zizmor-fixture:
    name: 'Zizmor (fixture)'
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      persona: 'regular'

  # Advisory run against this repository. audit_permit_fail is left at
  # its default so a finding reports without failing the self-test.
  package-hardening-self:
    name: 'Package Hardening (self)'
    permissions:
      contents: read
    uses: $/.github/workflows/package-hardening-audit.yaml
    with:
      cooldown_strategy: 'dependabot'

  # Exercise the Scorecard lane's analysis and plumbing WITHOUT touching
  # the published record. publish_results is off because this runs on
  # workflow_dispatch, which upstream treats as experimental, and a test
  # run should not overwrite the repository's real published score.
  #
  # The lane's compliance with the Scorecard API's workflow restrictions
  # is therefore NOT covered here: publishing is the only thing those
  # rules gate. openssf-scorecard-self.yaml is the integration test for
  # that, and it runs on every push to the default branch.
  openssf-scorecard-dry-run:
    name: 'OpenSSF Scorecard (dry run)'
    permissions:
      contents: read
    uses: $/.github/workflows/openssf-scorecard.yaml
    with:
      publish_results: false
      upload_sarif: false
      summary_enabled: false

  # Exercise the CodeQL lane's matrix construction, which is the part
  # this repository owns; the analysis itself belongs to the action.
  # Two languages confirm the matrix fans out and that artifact names
  # stay unique across jobs.
  #
  # upload is 'never' so a self-test does not file alerts against this
  # repository, and upload_database is off for the same reason.
  codeql-matrix:
    name: 'CodeQL (matrix)'
    permissions:
      contents: read
      packages: read  # fetch internal or private CodeQL packs
    uses: $/.github/workflows/codeql.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      languages: 'python,actions'
      upload: 'never'
      upload_database: false

  # Audit this repository's own action pins. full_scan is explicit
  # rather than relying on a workflow_dispatch having no changed-file
  # set to narrow to, so the self-test stays a whole-repository check
  # regardless of how the action treats non-pull_request events. The
  # target must be clean: this repository pins every `uses:` by commit
  # SHA, so a finding here means the lane regressed rather than the
  # target did.
  action-pin-audit-self:
    name: 'Action Pin Audit (self)'
    permissions:
      contents: read
    uses: $/.github/workflows/action-pin-audit.yaml
    with:
      full_scan: true

  # Exercise the cross-repository checkout path against a fixture, which
  # is the only part of the lane the self-scan above leaves uncovered.
  action-pin-audit-fixture:
    name: 'Action Pin Audit (fixture)'
    permissions:
      contents: read
    uses: $/.github/workflows/action-pin-audit.yaml
    with:
      repository: 'lfreleng-actions/test-python-project'
      full_scan: true

  # ---------------------------------------------------------------
  # Assertions
  # ---------------------------------------------------------------
  # The legs above prove the lanes run. These prove they did the
  # right thing. Both guard silent failures: a scan that measured
  # nothing, or evaluated the wrong tree, succeeds exactly as loudly
  # as one that did not, so only an assertion separates them.

  # Catches the aggregation half of the coverage path: an empty value
  # means the build measured nothing to forward, so the analysis fell
  # back to its own discovery and published whatever it found.
  #
  # It does NOT catch the forwarding half. This output and the scan
  # action's input read the same build step, so deleting the input
  # alone leaves this green. Proving the value reached the scanner
  # needs the action to report what it used, which it does not
  # expose; see #77.
  assert-coverage-paths:
    name: 'Assert (coverage paths)'
    needs: sonarqube-cloud-maven
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Require aggregate coverage paths'
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          PATHS: ${{ needs.sonarqube-cloud-maven.outputs.coverage_report_paths }}
        run: |
          set -euo pipefail
          if [ -z "${PATHS}" ]; then
            echo "::error::The Maven build measured no aggregate" \
              "JaCoCo coverage, so the lane forwarded no report" \
              "paths and the analysis published whatever it found" \
              "by itself. test-maven-project is a multi-module" \
              "reactor with JaCoCo bound, so this is a regression" \
              "rather than a project that opted out."
            exit 1
          fi
          echo "Forwarded coverage report paths: ${PATHS}"
          echo 'Aggregate coverage measured and forwarded ✅'

  # The other half of #77, and the one that needed the scan action to
  # report what it used. The job above proves the build measured
  # coverage; this proves the value reached the analysis.
  #
  # CLI mode is the mode that matters. sonar-maven-plugin derives
  # report paths from the project model, so a Maven-mode scan finds
  # coverage whether or not the lane forwards anything; the Scanner
  # CLI has no model and takes what it is given. Deleting the
  # coverage_report_paths line from the lane turns this job red and
  # leaves every other leg green.
  assert-coverage-forwarded:
    name: 'Assert (coverage forwarding)'
    needs: sonarqube-cloud-maven-cli
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Require the paths to appear in the scan arguments'
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          EXPECTED: ${{ needs.sonarqube-cloud-maven-cli.outputs.coverage_report_paths }}
          # yamllint disable-line rule:line-length
          ARGS: ${{ needs.sonarqube-cloud-maven-cli.outputs.scanner_args }}
        run: |
          set -euo pipefail

          if [ -z "${EXPECTED}" ]; then
            echo "::error::The Maven build measured no aggregate" \
              "JaCoCo coverage, so there is nothing to check the" \
              "forwarding against."
            exit 1
          fi
          if [ -z "${ARGS}" ]; then
            echo "::error::The scan reported no arguments. Check the" \
              "pinned sonarqube-cloud-scan-action still publishes" \
              "scanner_args (added in v1.6.0)."
            exit 1
          fi

          echo "Build measured:  ${EXPECTED}"
          echo "Scan received:   ${ARGS}"

          # Pad both sides so the pattern matches a WHOLE argument.
          # Without the trailing space, a shorter EXPECTED would also
          # match a longer path that merely starts with it.
          # yamllint disable rule:line-length
          case " ${ARGS} " in
            *" -Dsonar.coverage.jacoco.xmlReportPaths=${EXPECTED} "*)
              echo 'Coverage paths reached the analysis ✅'
              ;;
            *)
              echo "::error::The build measured coverage but the" \
                "analysis was not told about it. The lane's" \
                "coverage_report_paths wiring is broken: a CLI-mode" \
                "scan then reports whatever its own discovery finds," \
                "which succeeds and looks identical."
              exit 1
              ;;
          esac
          # yamllint enable rule:line-length

  # go.mod carries two version directives and 'toolchain' outranks
  # 'go'. Passing a version as setup-go's go-version suppresses the
  # file, and so the toolchain directive, and the build then runs and
  # scans perfectly well on the older Go -- there is no error to
  # notice. Compare what the lane resolved against what the fixture
  # asks for; see BRIEF.md D21.
  assert-go-toolchain:
    name: 'Assert (Go toolchain)'
    needs: [go-fixture-ref, sonatype-lifecycle-go, sonarqube-cloud-go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Checkout fixture'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'lfreleng-actions/test-go-project'
          # The same commit both lanes scanned, so the go.mod read
          # here is the go.mod they resolved their versions from.
          ref: ${{ needs.go-fixture-ref.outputs.sha }}
          persist-credentials: false
      - name: 'Compare resolved Go versions against go.mod'
        shell: bash
        env:
          CLM_VERSION: ${{ needs.sonatype-lifecycle-go.outputs.go_version }}
          # yamllint disable-line rule:line-length
          SONAR_VERSION: ${{ needs.sonarqube-cloud-go.outputs.go_version }}
        run: |
          set -euo pipefail

          # Read the directive rather than hardcode the version, so
          # bumping the fixture cannot silently disable the check.
          TOOLCHAIN="$(sed -n 's/^toolchain go//p' go.mod | head -1)"

          echo "CLM lane resolved:   ${CLM_VERSION:-<none>}"
          echo "Sonar lane resolved: ${SONAR_VERSION:-<none>}"

          status=0
          for lane in CLM Sonar; do
            case "${lane}" in
              CLM) resolved="${CLM_VERSION}" ;;
              Sonar) resolved="${SONAR_VERSION}" ;;
            esac
            if [ -z "${resolved}" ]; then
              echo "::error::The ${lane} lane reported no Go version."
              status=1
            fi
          done
          [ "${status}" -eq 0 ] || exit 1

          if [ -z "${TOOLCHAIN}" ]; then
            # With one directive there are not two answers to tell
            # apart, so an equality check here would pass whatever the
            # lanes did. Report the gap rather than assert nothing and
            # call it a pass -- and rather than fail, which would hold
            # the whole self-test red on a fixture this repository
            # does not own.
            echo "::warning::test-go-project declares no 'toolchain'" \
              "directive, so this check cannot tell a correct" \
              "resolution from the regression it exists to catch." \
              "Skipped rather than passed; see issue #75."
            {
              echo '### ⚠️ Go toolchain assertion skipped'
              echo
              echo 'The fixture declares one version directive, so'
              echo 'there are not two answers to distinguish. This'
              echo 'check becomes meaningful once the fixture gains a'
              echo 'toolchain directive -- see issue #75.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "go.mod toolchain directive: ${TOOLCHAIN}"
          for lane in CLM Sonar; do
            case "${lane}" in
              CLM) resolved="${CLM_VERSION}" ;;
              Sonar) resolved="${SONAR_VERSION}" ;;
            esac
            if [ "${resolved}" != "${TOOLCHAIN}" ]; then
              echo "::error::The ${lane} lane installed Go" \
                "${resolved}, but go.mod asks for ${TOOLCHAIN}." \
                "setup-go reads both directives from" \
                "go-version-file and prefers 'toolchain'; an" \
                "explicit go-version input suppresses the file."
              status=1
            fi
          done
          [ "${status}" -eq 0 ] || exit 1
          echo 'Both lanes resolved the toolchain the project asked ✅'

  # --- Submodules reach the scan (#74) ---------------------------------
  #
  # Both lanes hand 'submodules' to actions/checkout, and a fault there
  # is silent by construction: the scan keeps passing against less code.
  # Neither lane reports what it analysed, so assert-submodule-scan.yaml
  # asks the server afterwards, through tests/scan_contents.py.
  #
  # lfreleng-actions/test-python-submodules nests three levels, and each
  # carries something no other level does: a requirements.txt pin, which
  # Nexus IQ identifies, and a marker file, which Sonar indexes.
  #
  #   level    pin               marker
  #   parent   six==1.17.0       parent_level.py
  #   direct   iniconfig==2.0.0  direct/direct_level.py
  #   nested   tomli==2.2.1      direct/nested/nested_level.py
  #
  # Each lane scans twice. 'recursive' must yield all three levels.
  # 'true' must yield the direct level and NOT the nested one: that is
  # the negative control, proving the check can fail at all and catching
  # a lane that ignores the input and always recurses, which a
  # presence-only check would pass.
  #
  # Each lane's chain runs in series, because a lane scans into one
  # server-side project:
  #
  #   baseline -> scan recursive -> assert -> scan true -> assert
  #
  # The baseline records the newest result the server holds before the
  # first scan, and each assert emits the result it confirmed as the
  # next one's baseline. An assert accepts only a result with a new
  # identity that is strictly newer by the server's own clock, so it
  # cannot read one left by an earlier leg, and the workflow-wide
  # concurrency group above stops another run writing in between.

  # Every leg scans the same commit, so a push to the fixture mid-run
  # cannot leave the two checkout modes looking at different trees.
  submodule-fixture-ref:
    name: 'Resolve submodule fixture commit'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 'Resolve default branch head'
        id: resolve
        shell: bash
        env:
          FIXTURE: 'lfreleng-actions/test-python-submodules'
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${FIXTURE}.git" \
            refs/heads/main | cut -f1)"
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve ${FIXTURE} refs/heads/main"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${FIXTURE} pinned at ${sha}"

  submodule-clm-baseline:
    name: 'Baseline (CLM, submodules)'
    permissions:
      contents: read
    uses: $/.github/workflows/assert-submodule-scan.yaml
    with:
      mode: 'baseline'
      server: 'nexus-iq'
      subject: 'lfreleng-actions-test-python-submodules'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  submodule-clm-recursive:
    name: 'Sonatype Lifecycle (submodules: recursive)'
    needs: [submodule-fixture-ref, submodule-clm-baseline]
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-python-submodules'
      ref: ${{ needs.submodule-fixture-ref.outputs.sha }}
      build_type: 'none'
      submodules: 'recursive'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  submodule-clm-recursive-assert:
    name: 'Assert (CLM, submodules: recursive)'
    needs: [submodule-clm-baseline, submodule-clm-recursive]
    permissions:
      contents: read
    uses: $/.github/workflows/assert-submodule-scan.yaml
    with:
      mode: 'assert'
      server: 'nexus-iq'
      subject: 'lfreleng-actions-test-python-submodules'
      after: ${{ needs.submodule-clm-baseline.outputs.seen }}
      present: 'six,iniconfig,tomli'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  submodule-clm-true:
    name: 'Sonatype Lifecycle (submodules: true)'
    needs: [submodule-fixture-ref, submodule-clm-recursive-assert]
    permissions:
      contents: read
    uses: $/.github/workflows/sonatype-lifecycle.yaml
    with:
      repository: 'lfreleng-actions/test-python-submodules'
      ref: ${{ needs.submodule-fixture-ref.outputs.sha }}
      build_type: 'none'
      submodules: 'true'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  submodule-clm-true-assert:
    name: 'Assert (CLM, submodules: true)'
    needs: [submodule-clm-recursive-assert, submodule-clm-true]
    permissions:
      contents: read
    uses: $/.github/workflows/assert-submodule-scan.yaml
    with:
      mode: 'assert'
      server: 'nexus-iq'
      subject: 'lfreleng-actions-test-python-submodules'
      # The report the recursive leg confirmed, which the application
      # still holds: this must see a newer one, or it is reading that.
      after: ${{ needs.submodule-clm-recursive-assert.outputs.seen }}
      present: 'six,iniconfig'
      absent: 'tomli'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  submodule-sonar-baseline:
    name: 'Baseline (Sonar, submodules)'
    permissions:
      contents: read
    uses: $/.github/workflows/assert-submodule-scan.yaml
    with:
      mode: 'baseline'
      server: 'sonar'
      subject: 'lfreleng-actions_test-python-submodules'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # wait_for_quality_gate makes the scan action poll the compute task
  # until it has an analysis ID, so the job ends only once SonarCloud has
  # processed the analysis and the file tree the assertion reads is this
  # scan's. fail_on_quality_gate stays off: the fixture's code quality is
  # not what these legs test.
  #
  # sonar_branch_name is pinned, not left to the scanner. Unnamed, the
  # scanner's GitHub Actions auto-configuration analyses under the ref
  # that dispatched this run, so a run from a branch under review would
  # land on a branch the assertion never reads. tests/scan_contents.py
  # queries the same name (SONAR_BRANCH), so the two cannot disagree.
  #
  # The project is named here too, overriding the fixture's own
  # sonar-project.properties, for the same reason: the scan and the
  # assertion then name one project, whatever the fixture file says.
  submodule-sonar-recursive:
    name: 'SonarQube Cloud (submodules: recursive)'
    needs: [submodule-fixture-ref, submodule-sonar-baseline]
    permissions:
      contents: read
    uses: $/.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-python-submodules'
      ref: ${{ needs.submodule-fixture-ref.outputs.sha }}
      build_type: 'none'
      submodules: 'recursive'
      wait_for_quality_gate: true
      sonar_branch_name: 'main'
      sonar_organization: 'lfreleng-actions'
      sonar_project_key: 'lfreleng-actions_test-python-submodules'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  submodule-sonar-recursive-assert:
    name: 'Assert (Sonar, submodules: recursive)'
    needs: [submodule-sonar-baseline, submodule-sonar-recursive]
    permissions:
      contents: read
    uses: $/.github/workflows/assert-submodule-scan.yaml
    with:
      mode: 'assert'
      server: 'sonar'
      subject: 'lfreleng-actions_test-python-submodules'
      after: ${{ needs.submodule-sonar-baseline.outputs.seen }}
      present: 'parent_level.py,direct_level.py,nested_level.py'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  submodule-sonar-true:
    name: 'SonarQube Cloud (submodules: true)'
    needs: [submodule-fixture-ref, submodule-sonar-recursive-assert]
    permissions:
      contents: read
    uses: $/.github/workflows/sonarqube-cloud.yaml
    with:
      repository: 'lfreleng-actions/test-python-submodules'
      ref: ${{ needs.submodule-fixture-ref.outputs.sha }}
      build_type: 'none'
      submodules: 'true'
      wait_for_quality_gate: true
      sonar_branch_name: 'main'
      sonar_organization: 'lfreleng-actions'
      sonar_project_key: 'lfreleng-actions_test-python-submodules'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  submodule-sonar-true-assert:
    name: 'Assert (Sonar, submodules: true)'
    needs: [submodule-sonar-recursive-assert, submodule-sonar-true]
    permissions:
      contents: read
    uses: $/.github/workflows/assert-submodule-scan.yaml
    with:
      mode: 'assert'
      server: 'sonar'
      subject: 'lfreleng-actions_test-python-submodules'
      after: ${{ needs.submodule-sonar-recursive-assert.outputs.seen }}
      present: 'parent_level.py,direct_level.py'
      absent: 'nested_level.py'
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
