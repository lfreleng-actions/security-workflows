name: 'Probe reusable'
# yamllint disable-line rule:truthy
on:
  workflow_call:
permissions: {}
jobs:
  always-runs:
    name: 'Report event_name'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Report'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "PROBE github.event_name = '${EVENT_NAME}'"
          echo "PROBE github.ref_name  = '${REF_NAME}'"
  gated-on-pull-request:
    name: 'Gated on pull_request'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Ran'
        shell: bash
        run: echo "PROBE gated-on-pull_request JOB EXECUTED"
